name: Bug Report
description: Report a defect, crash, or unexpected behavior in OSCraft.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much context as possible so we can diagnose and resolve it quickly.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps required to trigger the issue.
      placeholder: |
        1. Run '...'
        2. Select '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: System & Environment
      description: Linux distribution, kernel version (`uname -r`), and Zig version (`zig version` or `zig17 version`).
      placeholder: "Arch Linux / Ubuntu 24.04, Linux 6.12, Zig 0.17.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Terminal Output
      description: Paste any terminal logs or stack traces here.
      render: shell
